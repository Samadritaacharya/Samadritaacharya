name: Expand DecisionForge staging payload

on:
  push:
    branches: [decisionforge-ai-staging]

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify project payload
        run: |
          cat .payload/part*.b64 | base64 --decode > /tmp/decisionforge-payload.tar.gz
          echo "e69e6fa1a6024fa3bd18fb8a7db5c0d7d60f81c5bec50199eaae760056a6e0d2  /tmp/decisionforge-payload.tar.gz" | sha256sum --check -
      - name: Expand tested project payload
        run: |
          git rm -rf .
          tar -xzf /tmp/decisionforge-payload.tar.gz
          git add -A
      - name: Commit expanded project tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build DecisionForge AI end-to-end"
          git push origin HEAD:decisionforge-ai-staging
