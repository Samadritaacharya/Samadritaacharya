<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Samadrita Acharya — governed AI, product, automation and AIOps</title>
  <desc id="desc">Modern midnight-blue GitHub profile banner with teal, cobalt and copper accents, abstract agentic systems graph, and concise professional positioning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B12"/>
      <stop offset="0.48" stop-color="#071A29"/>
      <stop offset="1" stop-color="#063451"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#35E0D0" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#35E0D0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4F8DFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#4F8DFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35E0D0" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#4F8DFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#D68B5A" stop-opacity="0.90"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#D9EEF7"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#B6D7E8" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
    <filter id="blur20" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="30" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="338" rx="29" fill="none" stroke="#9FC5D7" stroke-opacity="0.14"/>

  <circle cx="1030" cy="84" r="170" fill="url(#glowA)" filter="url(#blur20)"/>
  <circle cx="865" cy="286" r="175" fill="url(#glowB)" filter="url(#blur20)"/>
  <rect x="720" y="0" width="480" height="340" fill="url(#grid)"/>

  <g transform="translate(72 64)">
    <text x="0" y="0" dominant-baseline="hanging"
          font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="650" letter-spacing="4.5" fill="#8FBACD">SAMADRITA ACHARYA</text>

    <text x="0" y="54" dominant-baseline="hanging"
          font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="43" font-weight="760" letter-spacing="-1.2" fill="url(#headline)">BUILD SYSTEMS PEOPLE CAN TRUST</text>

    <text x="0" y="118" dominant-baseline="hanging"
          font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="520" fill="#B9D3DF">AI Transformation  •  Product Thinking  •  Automation  •  AIOps</text>

    <g transform="translate(0 178)">
      <rect x="0" y="0" width="114" height="31" rx="15.5" fill="#0E2A3D" stroke="#38D7C7" stroke-opacity="0.42"/>
      <text x="57" y="16" text-anchor="middle" dominant-baseline="middle"
            font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="650" letter-spacing="0.4" fill="#C8F6F1">AGENTIC AI</text>

      <rect x="126" y="0" width="118" height="31" rx="15.5" fill="#0E2A3D" stroke="#5D96FF" stroke-opacity="0.42"/>
      <text x="185" y="16" text-anchor="middle" dominant-baseline="middle"
            font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="650" letter-spacing="0.4" fill="#D6E4FF">AI GOVERNANCE</text>

      <rect x="256" y="0" width="142" height="31" rx="15.5" fill="#0E2A3D" stroke="#D68B5A" stroke-opacity="0.45"/>
      <text x="327" y="16" text-anchor="middle" dominant-baseline="middle"
            font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="650" letter-spacing="0.4" fill="#F4D3BF">TECHNICAL DELIVERY</text>
    </g>

    <g transform="translate(0 238)">
      <rect x="0" y="0" width="74" height="3" rx="1.5" fill="#D68B5A"/>
      <text x="93" y="-6" dominant-baseline="hanging"
            font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" fill="#B7CAD4">build with judgment · ship with evidence</text>
    </g>
  </g>

  <g opacity="0.92" filter="url(#softShadow)">
    <path d="M742 250 C810 170, 848 225, 914 152 S1048 90, 1148 128" fill="none" stroke="url(#flow)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M772 116 C832 94, 879 122, 924 92 S1043 52, 1115 79" fill="none" stroke="#A6C5D4" stroke-opacity="0.23" stroke-width="1.3"/>
    <path d="M813 290 C873 264, 920 277, 968 239 S1083 202, 1161 225" fill="none" stroke="#A6C5D4" stroke-opacity="0.20" stroke-width="1.3"/>

    <g fill="#071A29" stroke="#D4E8F1" stroke-opacity="0.62">
      <circle cx="742" cy="250" r="8" stroke-width="2"/>
      <circle cx="835" cy="192" r="7" stroke-width="2"/>
      <circle cx="914" cy="152" r="10" stroke="#35E0D0" stroke-opacity="0.9" stroke-width="2.4"/>
      <circle cx="1000" cy="104" r="7" stroke-width="2"/>
      <circle cx="1080" cy="103" r="10" stroke="#D68B5A" stroke-opacity="0.95" stroke-width="2.4"/>
      <circle cx="1148" cy="128" r="7" stroke-width="2"/>
    </g>

    <g fill="#35E0D0">
      <circle cx="914" cy="152" r="3.5"/>
      <circle cx="742" cy="250" r="2.8"/>
    </g>
    <g fill="#D68B5A">
      <circle cx="1080" cy="103" r="3.7"/>
    </g>

    <g stroke="#A8C7D6" stroke-opacity="0.22" fill="none">
      <circle cx="914" cy="152" r="42"/>
      <circle cx="914" cy="152" r="72"/>
      <circle cx="1080" cy="103" r="34"/>
      <circle cx="1080" cy="103" r="62"/>
    </g>

    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.1" fill="#9EC3D3">
      <text x="878" y="220">REASON</text>
      <text x="986" y="170">GOVERN</text>
      <text x="1076" y="177">ACT</text>
    </g>
  </g>
</svg>
